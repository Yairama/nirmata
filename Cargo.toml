[workspace]
members = [
    "crates/nirmata-core",
    "crates/nirmata-store",
    "crates/nirmata-ai",
    "crates/nirmata-app",
    "apps/nirmata-desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
schemars = { version = "0.8.22", features = ["uuid1"] }
uuid = { version = "1", features = ["serde", "v4"] }
